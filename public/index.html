  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <!-- CAPA FONDO (rebranding): cajas cuadradas + UI de vidrio fina sobre el fondo
       animado del JP Shader Editor. Mismo enganche que galeria.html/404.html/terminos.html -->
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
  <link rel="stylesheet" href="css/paginas/index.css">
  <style>
    /* La composicion del JP Shader Editor sale con ALPHA (el pase ASCII escribe
       vec4(col*a, a)): lo que se ve detras del shader es la BASE de la pagina. La base
       tiene que ser el #0d0d12 del sitio (como el negro del visor del nodeeditor) y NO
       el blanco del navegador. El color vive en <html> (se pinta DETRAS del canvas del
       shader, que tiene z-index:-1); el <body> NO puede ser opaco porque taparia el
       canvas. Es la misma regla que ya trae css/fondo-ui.css. */
    html { background-color: #0d0d12 !important; }
    body { background-color: transparent !important; }
    #jpsi-canvas { background: #0d0d12 !important; }
    /* Canvas de p5 - por encima del fondo, debajo del contenido */
    #p5-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }
    
    /* Botones con fondo transparente para ver el efecto de fondo */
    .filter-switch {
      background: transparent !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }
    
    .filter-switch:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* Estados activos - colores con fondo semi-transparente */
    .filter-post.active {
      background: rgba(34, 211, 238, 0.25) !important;
      border-color: #22d3ee !important;
      color: #22d3ee !important;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    }
    .filter-recurso.active {
      background: rgba(132, 204, 22, 0.25) !important;
      border-color: #84cc16 !important;
      color: #a3e635 !important;
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.3);
    }
    .filter-evento.active {
      background: rgba(232, 121, 249, 0.25) !important;
      border-color: #e879f9 !important;
      color: #e879f9 !important;
      box-shadow: 0 0 20px rgba(232, 121, 249, 0.3);
    }
    .filter-oportunidad.active {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: #eab308 !important;
      color: #facc15 !important;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }


    /* Pills de categoría del feed (Obras / Recursos / Chances / Eventos).
       Antes orbitaban como "lunas" alrededor del logo del hero; ahora viven en
       la barra de filtros del feed, junto al switch humano/IA y Data Externa.
       El color y el fondo de cada una los sigue dando .filter-switch + .filter-<tipo>.active */
    .feed-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 0;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
    }
    .feed-pill:hover {
      transform: translateY(-1px) scale(1.04);
    }
  </style>
</head>

<body class="ui-con-header min-h-screen scrollbar-hide">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
  <div id="app-header" style="position: relative; z-index: 100;"></div>

  <main class="pt-24 pb-6 max-w-7xl mx-auto px-4" style="position: relative; z-index: 10;">
    <!-- Hero Section -->
    <section class="text-center pt-1 pb-1 flex flex-col items-center justify-center relative select-none">
      

      <div id="hero-cta"></div>
    </section>

    <!-- Pinned Events Section -->
    <section id="pinned-section" class="mb-12 hidden">
      <h2 class="text-2xl font-bold text-white mb-6 flex items-center">
        Contenido Destacado
      </h2>
      <div id="pinned-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

    <!-- Feed -->
    <section>
      <div class="flex flex-wrap items-center gap-2 sm:gap-3 mb-6">
        <button onclick="toggleHumanAI()" id="filter-human-ai" class="w-9 h-9 rounded-xl border border-emerald-500/40 bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-all hover:scale-105 hover:border-emerald-500 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0" title="Mostrando contenido Humano (Click para cambiar a IA)">
          <i class="fas fa-user text-sm"></i>
        </button>
        <button onclick="toggleExternalData()" id="filter-external" class="h-9 px-3.5 rounded-xl border border-white/10 bg-white/5 text-gray-400 flex items-center gap-2 transition-all hover:border-cyan-500/50 hover:bg-white/10 shrink-0" title="Data Externa: sumar al feed las creaciones del resto de las apps del ecosistema (apagado por defecto)">
          <span id="filter-external-knob" class="w-3.5 h-3.5 rounded-full bg-gray-600 transition-all"></span>
          <span class="text-[10px] font-black uppercase tracking-widest">Data Externa</span>
        </button>

        <span class="hidden sm:block w-px h-6 bg-white/10 shrink-0" aria-hidden="true"></span>

        <!-- Categorías del feed (antes orbitaban como lunas en el hero) -->
        <button onclick="toggleFilter('post')" id="filter-post" class="filter-switch filter-post active feed-pill" title="Obras: mostrar/ocultar las obras publicadas">
          <span>Obras</span>
        </button>
        <button onclick="toggleFilter('recurso')" id="filter-recurso" class="filter-switch filter-recurso active feed-pill" title="Recursos: mostrar/ocultar los recursos del ecosistema">
          <span>Recursos</span>
        </button>
        <button onclick="toggleFilter('oportunidad')" id="filter-oportunidad" class="filter-switch filter-oportunidad active feed-pill" title="Chances: mostrar/ocultar las convocatorias y oportunidades">
          <span>Chances</span>
        </button>
        <button onclick="toggleFilter('evento')" id="filter-evento" class="filter-switch filter-evento active feed-pill" title="Eventos: mostrar/ocultar los eventos">
          <span>Eventos</span>
        </button>
      </div>
      <p id="external-status" class="hidden text-[11px] font-bold text-cyan-400 mb-4"></p>
      <!-- Filtros de Data Externa: por APLICACIÓN y por TIPO (los arma el backend desde fscauth) -->
      <div id="external-filters" class="hidden mb-6 space-y-3"></div>
      <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-500 py-20">
          <i class="fas fa-spinner fa-spin text-3xl text-orange-400 mb-4"></i>
          <p>Cargando arte...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- FONDO: lo sirve el JP Shader Editor (jpshadereditorInclude), igual que en
       vuelapelucas3000 y jpshadereditor. Es una COMPOSICION del NodeEditor:
         composicion: artedigital-ascii ("Arte Digital Data - ASCII (patron + tipografia)", autor jpupper)
         caja de fondo: ascii1 (su OUTPUT)
       Se edita en https://fullscreencode.com/jpshadereditor/nodeeditor.html?comp=artedigital-ascii
       y la pagina pide el plan al backend y lo aplica sola (panel en vivo: tecla S).
       Antes: js/ascii-shader-bg.js (shader fijo, se saco). -->
  <script>window.FSC_NO_ASCII_BG = true; /* que p5-effect.js no vuelva a inyectar el fondo viejo */</script>
  <script src="js/p5-effect.js?v=4"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/external-data.js?v=5"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/header.js?v=4"></script>
  <script src="js/tagging.js"></script>
  <script src="js/forms.js?v=2"></script>
  <script src="js/image-cropper.js"></script>
  <script src="js/index.js?v=5"></script>
  <!-- 🔘 Botón universal FSC: lleva al pasaporte de usuario (fscauth) -->
  <script src="https://vps-4455523-x.dattaweb.com/jpconnect/js/fsc-button.js?v=10"></script>
</body>
