<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Arte Digital Data - Feed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    /* Canvas de p5 - por encima del fondo, debajo del contenido */
    #p5-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }
    
    /* Botones con fondo transparente para ver el efecto de fondo */
    .filter-switch {
      background: transparent !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }
    
    .filter-switch:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* Estados activos - colores con fondo semi-transparente */
    .filter-post.active {
      background: rgba(34, 211, 238, 0.25) !important;
      border-color: #22d3ee !important;
      color: #22d3ee !important;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    }
    .filter-recurso.active {
      background: rgba(132, 204, 22, 0.25) !important;
      border-color: #84cc16 !important;
      color: #a3e635 !important;
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.3);
    }
    .filter-evento.active {
      background: rgba(232, 121, 249, 0.25) !important;
      border-color: #e879f9 !important;
      color: #e879f9 !important;
      box-shadow: 0 0 20px rgba(232, 121, 249, 0.3);
    }
    .filter-oportunidad.active {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: #eab308 !important;
      color: #facc15 !important;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }

    /* === SOLAR SYSTEM HERO === */
    .sun-stage {
      position: relative;
      width: 310px;
      height: 310px;
      margin: 1rem auto 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .sun-stage {
        width: 380px;
        height: 380px;
        margin: 1.5rem auto 2.5rem auto;
      }
    }
    @media (min-width: 768px) {
      .sun-stage {
        width: 440px;
        height: 440px;
        margin: 2rem auto 3rem auto;
      }
    }

    /* Sol Central & Corona */
    .sun-core-wrap {
      position: absolute;
      z-index: 20;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .sun-core-wrap {
        width: 126px;
        height: 126px;
      }
    }
    @media (min-width: 768px) {
      .sun-core-wrap {
        width: 144px;
        height: 144px;
      }
    }

    .sun-corona {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 190, 20, 0.75) 0%, rgba(255, 110, 0, 0.45) 45%, rgba(255, 50, 0, 0.12) 70%, transparent 85%);
      filter: blur(14px);
      animation: sunGlowPulse 3.8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .sun-flares {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(255, 210, 50, 0.5) 0deg,
        transparent 25deg,
        rgba(255, 120, 0, 0.4) 50deg,
        transparent 75deg,
        rgba(255, 235, 80, 0.55) 100deg,
        transparent 125deg,
        rgba(255, 90, 0, 0.35) 150deg,
        transparent 175deg,
        rgba(255, 220, 50, 0.5) 200deg,
        transparent 225deg,
        rgba(255, 140, 0, 0.45) 250deg,
        transparent 275deg,
        rgba(255, 245, 90, 0.55) 300deg,
        transparent 325deg,
        rgba(255, 210, 50, 0.5) 360deg
      );
      filter: blur(8px);
      animation: sunFlaresSpin 45s linear infinite;
      pointer-events: none;
    }
    .sun-disc {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 240, 180, 0.95), rgba(255, 145, 10, 0.88) 60%, rgba(210, 65, 0, 0.98) 100%);
      box-shadow: 0 0 35px rgba(255, 175, 0, 0.9), 0 0 75px rgba(255, 90, 0, 0.65), inset 0 0 20px rgba(255, 255, 255, 0.6);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 235, 160, 0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .sun-disc:hover {
      transform: scale(1.07);
    }
    .sun-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    @keyframes sunGlowPulse {
      0% { transform: scale(0.93); opacity: 0.75; }
      100% { transform: scale(1.14); opacity: 1; }
    }
    @keyframes sunFlaresSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Anillo Orbital */
    .orbit-ring {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 195, 80, 0.22);
      box-shadow: 0 0 30px rgba(255, 175, 0, 0.08), inset 0 0 30px rgba(255, 175, 0, 0.08);
      pointer-events: none;
    }

    /* Moons Orbit Rotator */
    .orbit-rotator {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      pointer-events: none;
      animation: moonsOrbit 80s linear infinite;
      transform-origin: center center;
      will-change: transform;
    }

    /* Moons Counter-Rotation (para mantener los textos siempre nivelados) */
    .moon-unit {
      position: absolute;
      pointer-events: auto;
      transform-origin: center center;
    }
    .moon-counter {
      animation: moonsCounter 80s linear infinite;
      transform-origin: center center;
      will-change: transform;
    }

    /* Ubicaciones de las 4 Lunas (Norte, Este, Sur, Oeste) */
    .moon-north {
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .moon-east {
      top: 50%;
      right: 0;
      transform: translate(50%, -50%);
    }
    .moon-south {
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 50%);
    }
    .moon-west {
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
    }

    @keyframes moonsOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes moonsCounter {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* Moon Buttons */
    .moon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
    }
    .moon-pill:hover {
      transform: scale(1.12);
    }
  </style>
</head>

<body class="min-h-screen scrollbar-hide">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
  <div id="app-header" style="position: relative; z-index: 100;"></div>

  <main class="pt-16 pb-10 max-w-7xl mx-auto px-4" style="position: relative; z-index: 10;">
    <!-- Hero / Solar System Section -->
    <section class="text-center pt-2 pb-2 flex flex-col items-center justify-center relative select-none">
      
      <!-- Solar Orbit Container -->
      <div id="solar-system" class="sun-stage">
        
        <!-- Sol (Center Logo + Solar Corona + Flares) -->
        <div class="sun-core-wrap">
          <div class="sun-corona"></div>
          <div class="sun-flares"></div>
          <div class="sun-disc">
            <img src="img/artedigital.png" alt="Arte Digital Data" class="sun-logo-img">
          </div>
        </div>

        <!-- Anillo Orbital -->
        <div class="orbit-ring"></div>

        <!-- Orbiting Moons Carrier (4 categorías que orbitan muy lentamente alrededor del sol) -->
        <div id="orbit-rotator" class="orbit-rotator">
          
          <!-- Luna 1: Obras (Norte) -->
          <div class="moon-unit moon-north">
            <div class="moon-counter">
              <button onclick="toggleFilter('post')" id="filter-post" class="filter-switch filter-post active moon-pill">
                <i class="fas fa-palette text-xs shrink-0"></i>
                <span>Obras</span>
              </button>
            </div>
          </div>

          <!-- Luna 2: Chance (Este) -->
          <div class="moon-unit moon-east">
            <div class="moon-counter">
              <button onclick="toggleFilter('oportunidad')" id="filter-oportunidad" class="filter-switch filter-oportunidad active moon-pill">
                <i class="fas fa-briefcase text-xs shrink-0"></i>
                <span>Chance</span>
              </button>
            </div>
          </div>

          <!-- Luna 3: Eventos (Sur) -->
          <div class="moon-unit moon-south">
            <div class="moon-counter">
              <button onclick="toggleFilter('evento')" id="filter-evento" class="filter-switch filter-evento active moon-pill">
                <i class="fas fa-calendar-alt text-xs shrink-0"></i>
                <span>Eventos</span>
              </button>
            </div>
          </div>

          <!-- Luna 4: Recursos (Oeste) -->
          <div class="moon-unit moon-west">
            <div class="moon-counter">
              <button onclick="toggleFilter('recurso')" id="filter-recurso" class="filter-switch filter-recurso active moon-pill">
                <i class="fas fa-box-open text-xs shrink-0"></i>
                <span>Recursos</span>
              </button>
            </div>
          </div>

        </div>

      </div>

      <div id="hero-cta"></div>
    </section>

    <!-- Pinned Events Section -->
    <section id="pinned-section" class="mb-12 hidden">
      <h2 class="text-2xl font-bold text-white mb-6">
        <i class="fas fa-thumbtack text-[var(--color-cyan)] mr-2"></i>Pins Destacados
      </h2>
      <div id="pinned-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

    <!-- Feed -->
    <section>
      <div class="flex items-center gap-3 mb-6">
        <button onclick="toggleHumanAI()" id="filter-human-ai" class="w-9 h-9 rounded-xl border border-emerald-500/40 bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-all hover:scale-105 hover:border-emerald-500 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0" title="Mostrando contenido Humano (Click para cambiar a IA)">
          <i class="fas fa-user text-sm"></i>
        </button>
        <h2 class="text-2xl font-bold text-white tracking-tight">
          Feed Global
        </h2>
      </div>
      <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-500 py-20">
          <i class="fas fa-spinner fa-spin text-3xl text-orange-400 mb-4"></i>
          <p>Cargando arte...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/header.js"></script>
  <script src="js/tagging.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
