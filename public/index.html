<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Arte Digital Data - Feed</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    /* Canvas de p5 - por encima del fondo, debajo del contenido */
    #p5-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
      pointer-events: none !important;
    }
    
    /* Botones con fondo transparente para ver el efecto de fondo */
    .filter-switch {
      background: transparent !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      transition: all 0.3s ease;
      position: relative;
      z-index: 10;
    }
    
    .filter-switch:hover {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
    }
    
    /* Estados activos - colores con fondo semi-transparente */
    .filter-post.active {
      background: rgba(34, 211, 238, 0.25) !important;
      border-color: #22d3ee !important;
      color: #22d3ee !important;
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.3);
    }
    .filter-recurso.active {
      background: rgba(132, 204, 22, 0.25) !important;
      border-color: #84cc16 !important;
      color: #a3e635 !important;
      box-shadow: 0 0 20px rgba(132, 204, 22, 0.3);
    }
    .filter-evento.active {
      background: rgba(232, 121, 249, 0.25) !important;
      border-color: #e879f9 !important;
      color: #e879f9 !important;
      box-shadow: 0 0 20px rgba(232, 121, 249, 0.3);
    }
    .filter-oportunidad.active {
      background: rgba(234, 179, 8, 0.25) !important;
      border-color: #eab308 !important;
      color: #facc15 !important;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
    }

    /* === TAMAÑO DEL LOGO PRINCIPAL (Modificá este valor para cambiar el alto) === */
    .hero-logo {
      height: 100px; /* <--- Cambiá este alto a tu gusto (ej: 80px, 100px, 120px) */
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(0, 245, 255, 0.35));
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }
    .hero-logo:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body class="min-h-screen scrollbar-hide">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
  <div id="app-header" style="position: relative; z-index: 100;"></div>

  <main class="pt-20 pb-10 max-w-7xl mx-auto px-4" style="position: relative; z-index: 10;">
    <!-- Hero Section -->
    <section class="mb-8 text-center pt-6 pb-2 flex flex-col items-center justify-center">
      <img src="img/artedigital.png" alt="Arte Digital Data" class="hero-logo">
      <p class="text-white text-lg md:text-xl max-w-2xl mx-auto font-medium">
        La red social para artistas digitales.
      </p>
      <div id="hero-cta"></div>
    </section>

    <!-- Feed Filters (2x2 Grid) -->
    <section class="mb-8">
      <div class="grid grid-cols-2 gap-4 max-w-xl mx-auto">
        <button onclick="toggleFilter('post')" id="filter-post" class="filter-switch filter-post active flex items-center justify-center gap-2.5 px-6 py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap">
          <i class="fas fa-palette text-sm shrink-0"></i><span>Obras</span>
        </button>
        <button onclick="toggleFilter('oportunidad')" id="filter-oportunidad" class="filter-switch filter-oportunidad active flex items-center justify-center gap-2.5 px-6 py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap">
          <i class="fas fa-briefcase text-sm shrink-0"></i><span>Oportunidades</span>
        </button>
        <button onclick="toggleFilter('evento')" id="filter-evento" class="filter-switch filter-evento active flex items-center justify-center gap-2.5 px-6 py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap">
          <i class="fas fa-calendar-alt text-sm shrink-0"></i><span>Eventos</span>
        </button>
        <button onclick="toggleFilter('recurso')" id="filter-recurso" class="filter-switch filter-recurso active flex items-center justify-center gap-2.5 px-6 py-5 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap">
          <i class="fas fa-box-open text-sm shrink-0"></i><span>Recursos</span>
        </button>
      </div>
    </section>

    <!-- Pinned Events Section -->
    <section id="pinned-section" class="mb-12 hidden">
      <h2 class="text-2xl font-bold text-white mb-6">
        <i class="fas fa-thumbtack text-[var(--color-cyan)] mr-2"></i>Pins Destacados
      </h2>
      <div id="pinned-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

    <!-- Feed -->
    <section>
      <div class="flex items-center gap-3 mb-6">
        <button onclick="toggleHumanAI()" id="filter-human-ai" class="w-9 h-9 rounded-xl border border-emerald-500/40 bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-all hover:scale-105 hover:border-emerald-500 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0" title="Mostrando contenido Humano (Click para cambiar a IA)">
          <i class="fas fa-user text-sm"></i>
        </button>
        <h2 class="text-2xl font-bold text-white tracking-tight">
          Feed Global
        </h2>
      </div>
      <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-500 py-20">
          <i class="fas fa-spinner fa-spin text-3xl text-orange-400 mb-4"></i>
          <p>Cargando arte...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/p5-effect.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/header.js"></script>
  <script src="js/tagging.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
