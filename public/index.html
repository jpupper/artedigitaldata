<!DOCTYPE html>
<html lang="es" data-theme="suave">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Arte Digital Data — Red Social y Comunidad para Artistas Digitales</title>
  <meta name="description" content="Arte Digital Data es la red social global para artistas digitales, diseñadores, músicos y creadores visuales. Explorá obras, eventos, recursos e inspirate en la comunidad.">
  <link rel="canonical" href="https://artedigitaldata.com/">
  
  <!-- Open Graph / Social Media Preview Cards (WhatsApp, Discord, Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://artedigitaldata.com/">
  <meta property="og:title" content="Arte Digital Data — Red Social y Comunidad Creativa">
  <meta property="og:description" content="Red social global para artistas digitales, músicos y diseñadores. Obras, eventos, recursos e inspiración en tiempo real.">
  <meta property="og:image" content="https://artedigitaldata.com/img/artedigital.png">
  <meta property="og:locale" content="es_AR">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://artedigitaldata.com/">
  <meta name="twitter:title" content="Arte Digital Data — Red Social Creativa">
  <meta name="twitter:description" content="Red social global para artistas digitales, músicos y diseñadores.">
  <meta name="twitter:image" content="https://artedigitaldata.com/img/artedigital.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <!-- CAPA FONDO: mínima, en vidrio, para convivir con el fondo animado.
       Se carga última (gana en el cascade) y sólo toca piel, no lógica. -->
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
  <link rel="stylesheet" href="css/paginas/index.css">
</head>

<body class="ui-con-header min-h-screen scrollbar-hide">
  <div id="p5-canvas" class="dp-1"></div>
  <div id="app-header" class="dp-2"></div>

  <main class="pt-24 pb-6 max-w-7xl mx-auto px-4 dp-3">
    <!-- Hero: título + CTA (el logo del medio con su aura se sacó a pedido) -->
    <section class="fk-hero">
      <div>
        <h1>Arte Digital Data</h1>
        <p>obras, recursos, convocatorias, eventos</p>
      </div>
      <div id="hero-cta"></div>
    </section>

    <!-- Pinned Events Section -->
    <section id="pinned-section" class="hidden">
      <div class="fk-sec"><h2>Contenido destacado</h2></div>
      <div id="pinned-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </section>

    <!-- Feed -->
    <section>
      <div class="fk-toolbar">
        <button data-on-click="toggleHumanAI()" id="filter-human-ai" class="w-9 h-9 rounded-xl border border-emerald-500/40 bg-emerald-500/20 text-emerald-400 flex items-center justify-center transition-all hover:scale-105 hover:border-emerald-500 hover:shadow-[0_0_15px_rgba(16,185,129,0.3)] shrink-0" title="Mostrando contenido Humano (Click para cambiar a IA)">
          <i class="fas fa-user text-sm"></i>
        </button>
        <button data-on-click="toggleExternalData()" id="filter-external" class="h-9 px-3.5 rounded-xl border border-white/10 bg-white/5 text-gray-400 flex items-center gap-2 transition-all hover:border-cyan-500/50 hover:bg-white/10 shrink-0" title="Data Externa: sumar al feed las creaciones del resto de las apps del ecosistema (apagado por defecto)">
          <span id="filter-external-knob" class="w-3.5 h-3.5 rounded-full bg-gray-600 transition-all"></span>
          <span class="text-[10px] font-black uppercase tracking-widest">Data Externa</span>
        </button>

        <span class="fk-div" aria-hidden="true"></span>

        <!-- Categorías del feed (antes orbitaban como lunas en el hero):
             un solo control segmentado, un punto de color por categoría -->
        <div class="fk-seg">
          <button data-on-click="toggleFilter('post')" id="filter-post" class="filter-switch filter-post active feed-pill" title="Obras: mostrar/ocultar las obras publicadas">Obras</button>
          <button data-on-click="toggleFilter('recurso')" id="filter-recurso" class="filter-switch filter-recurso active feed-pill" title="Recursos: mostrar/ocultar los recursos del ecosistema">Recursos</button>
          <button data-on-click="toggleFilter('oportunidad')" id="filter-oportunidad" class="filter-switch filter-oportunidad active feed-pill" title="Chances: mostrar/ocultar las convocatorias y oportunidades">Chances</button>
          <button data-on-click="toggleFilter('evento')" id="filter-evento" class="filter-switch filter-evento active feed-pill" title="Eventos: mostrar/ocultar los eventos">Eventos</button>
        </div>
      </div>
      <p id="external-status" class="hidden text-[11px] font-bold text-cyan-400 mb-4"></p>
      <!-- Filtros de Data Externa: por APLICACIÓN y por TIPO (los arma el backend desde fscauth) -->
      <div id="external-filters" class="hidden mb-6 space-y-3"></div>
      <div id="feed-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center text-gray-500 py-20">
          <i class="fas fa-spinner fa-spin text-3xl text-orange-400 mb-4"></i>
          <p>Cargando arte...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- FONDO: lo sirve el JP Shader Editor (jpshadereditorInclude), igual que en
       vuelapelucas3000 y jpshadereditor. Es una COMPOSICION del NodeEditor:
         composicion: artedigital-ascii ("Arte Digital Data - ASCII (patron + tipografia)", autor jpupper)
         caja de fondo: ascii1 (su OUTPUT)
       Se edita en https://fullscreencode.com/jpshadereditor/nodeeditor.html?comp=artedigital-ascii
       y la pagina pide el plan al backend y lo aplica sola (panel en vivo: tecla S).
       Antes: js/ascii-shader-bg.js (shader fijo, se saco). -->
  <script src="js/p5-effect.js?v=12"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/external-data.js?v=5"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/header.js?v=5"></script>
  <script src="js/tagging.js"></script>
  <script src="js/forms.js?v=2"></script>
  <script src="js/image-cropper.js"></script>
  <script src="js/index.js?v=6"></script>
  <!-- 🔘 Botón universal FSC: lleva al pasaporte de usuario (fscauth) -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=10"></script>
<script src="js/lib/inline-handlers.js" defer></script>
</body>

</html>
