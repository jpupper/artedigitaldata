<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postulantes - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-screen">
  <div id="p5-global-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-5xl mx-auto px-4">
    <!-- Loading -->
    <div id="loading" class="text-center py-20">
      <i class="fas fa-spinner fa-spin text-4xl text-emerald-400 mb-4"></i>
      <p class="text-gray-400">Verificando permisos y cargando postulantes...</p>
    </div>

    <!-- Error / Acceso Denegado -->
    <div id="unauthorized-message" class="hidden text-center py-20 bg-white/5 border border-red-500/30 rounded-3xl p-8 max-w-xl mx-auto">
      <i class="fas fa-user-lock text-5xl text-red-400 mb-4"></i>
      <h2 class="text-2xl font-bold text-white mb-2">Acceso Restringido</h2>
      <p id="unauthorized-reason" class="text-gray-400 mb-6">Esta sección solo está disponible para el creador de la oportunidad.</p>
      <a href="oportunidades.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-bold text-sm uppercase tracking-widest hover:bg-emerald-500/20 transition-all">
        <i class="fas fa-arrow-left"></i> Volver a Oportunidades
      </a>
    </div>

    <!-- Contenido de Postulantes (Solo para Creador) -->
    <div id="postulantes-content" class="hidden space-y-8">
      <!-- Header Convocatoria -->
      <section class="bg-white/5 border border-white/10 rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-3">
          <a id="btn-back-opo" href="oportunidad.html" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:border-emerald-500/50 transition-all">
            <i class="fas fa-arrow-left"></i>
          </a>
          <span id="opo-tipo-badge" class="px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest"></span>
        </div>
        <h1 id="opo-titulo" class="text-2xl md:text-3xl font-black text-white mb-2"></h1>
        <p class="text-sm text-gray-400 flex items-center gap-2">
          <i class="fas fa-users text-emerald-400"></i>
          <span>Gestión de postulaciones recibidas</span>
        </p>
      </section>

      <!-- Lista de Inscriptos -->
      <section>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i class="fas fa-clipboard-list text-emerald-400"></i> Postulaciones (<span id="total-count">0</span>)
          </h2>

          <!-- Filtros por Origen -->
          <div class="inline-flex p-1 rounded-2xl bg-white/5 border border-white/10 shrink-0">
            <button onclick="filtrarPostulaciones('all')" id="btn-filtro-all" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-lg flex items-center gap-1.5">
              <span>Todas</span> (<span id="count-all">0</span>)
            </button>
            <button onclick="filtrarPostulaciones('obra')" id="btn-filtro-obra" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center gap-1.5">
              <i class="fas fa-palette text-cyan-400"></i>
              <span>Obras</span> (<span id="count-obras">0</span>)
            </button>
            <button onclick="filtrarPostulaciones('formulario')" id="btn-filtro-formulario" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center gap-1.5">
              <i class="fas fa-file-signature text-emerald-400"></i>
              <span>Formulario</span> (<span id="count-formulario">0</span>)
            </button>
          </div>
        </div>

        <div id="inscripciones-container" class="space-y-4">
          <!-- Se llena dinámicamente -->
        </div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
  <script>
    let oportunidadId = null;
    let oportunidadData = null;

    const tipoLabels = {
      convocatoria_obra: 'Convocatoria de Obra',
      oportunidad_laboral: 'Oportunidad Laboral',
      colaboracion: 'Colaboración'
    };

    const tipoColors = {
      convocatoria_obra: 'cyan',
      oportunidad_laboral: 'orange',
      colaboracion: 'magenta'
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      oportunidadId = urlParams.get('id');

      if (!oportunidadId) {
        showUnauthorized('No se especificó la oportunidad.');
        return;
      }

      await checkAccessAndLoad();
    });

    async function checkAccessAndLoad() {
      try {
        // Verificar si inició sesión
        if (!isLoggedIn()) {
          showUnauthorized('Debés iniciar sesión con la cuenta creadora de la oportunidad.');
          return;
        }

        // Cargar datos de la oportunidad
        const resOpo = await fetch(CONFIG.API_URL + '/oportunidades/' + oportunidadId);
        if (!resOpo.ok) {
          showUnauthorized('La oportunidad solicitada no existe.');
          return;
        }

        oportunidadData = await resOpo.json();

        // Verificar si el usuario actual es el creador o admin
        const userId = getUserId();
        const creadorId = oportunidadData.creador?._id || oportunidadData.creador;
        const esCreador = creadorId === userId || isAdmin();

        if (!esCreador) {
          showUnauthorized('No tenés permisos para ver los postulantes de esta oportunidad.');
          return;
        }

        // Renderizar header de oportunidad
        renderOportunidadHeader(oportunidadData);

        // Cargar las postulaciones
        await loadInscripciones();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('postulantes-content').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        showUnauthorized('Error al validar permisos o cargar datos.');
      }
    }

    function renderOportunidadHeader(opo) {
      document.getElementById('opo-titulo').textContent = opo.titulo;
      document.getElementById('btn-back-opo').href = `oportunidad.html?id=${opo._id}`;

      const color = tipoColors[opo.tipo] || 'emerald';
      const badge = document.getElementById('opo-tipo-badge');
      badge.className = `px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest bg-${color}-500/20 text-${color}-400 border border-${color}-500/30`;
      badge.textContent = tipoLabels[opo.tipo] || 'Oportunidad';
    }

    let todasLasInscripciones = [];
    let filtroActual = 'all';

    function filtrarPostulaciones(tipo) {
      filtroActual = tipo;

      ['all', 'obra', 'formulario'].forEach(t => {
        const btn = document.getElementById(`btn-filtro-${t}`);
        if (!btn) return;
        if (t === tipo) {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-lg flex items-center gap-1.5';
        } else {
          btn.className = 'px-4 py-2 rounded-xl text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center gap-1.5';
        }
      });

      renderInscripcionesList();
    }

    async function loadInscripciones() {
      const container = document.getElementById('inscripciones-container');

      try {
        const res = await apiRequest(`/oportunidades/${oportunidadId}/inscripciones`);
        if (!res || !res.ok) {
          container.innerHTML = '<p class="text-center text-gray-500 py-10">Error al cargar las postulaciones.</p>';
          return;
        }

        todasLasInscripciones = await res.json();

        // Contadores
        const total = todasLasInscripciones.length;
        const obrasCount = todasLasInscripciones.filter(i => (i.tipoInscripcion === 'obra' || i.obra || i.datos?.tipoInscripcion === 'obra')).length;
        const formCount = total - obrasCount;

        document.getElementById('total-count').textContent = total;
        document.getElementById('count-all').textContent = total;
        document.getElementById('count-obras').textContent = obrasCount;
        document.getElementById('count-formulario').textContent = formCount;

        renderInscripcionesList();
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-center text-gray-500 py-10">Error al cargar las postulaciones.</p>';
      }
    }

    function renderInscripcionesList() {
      const container = document.getElementById('inscripciones-container');

      let filtradas = todasLasInscripciones;
      if (filtroActual === 'obra') {
        filtradas = todasLasInscripciones.filter(i => (i.tipoInscripcion === 'obra' || i.obra || i.datos?.tipoInscripcion === 'obra'));
      } else if (filtroActual === 'formulario') {
        filtradas = todasLasInscripciones.filter(i => (i.tipoInscripcion !== 'obra' && !i.obra && i.datos?.tipoInscripcion !== 'obra'));
      }

      if (!filtradas.length) {
        container.innerHTML = `
          <div class="text-center text-gray-500 py-16 bg-white/5 rounded-3xl border border-white/10">
            <i class="fas fa-inbox text-5xl text-gray-600 mb-3"></i>
            <p class="text-lg text-gray-300 font-bold">No hay postulaciones en esta vista</p>
            <p class="text-sm text-gray-500">Probá cambiando el filtro superior.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtradas.map(insc => {
        const user = insc.usuario || {};
        const estadoColors = {
          pendiente: 'yellow',
          aceptada: 'green',
          rechazada: 'red'
        };
        const estadoColor = estadoColors[insc.estado] || 'gray';

        const esObra = insc.tipoInscripcion === 'obra' || insc.obra || insc.datos?.tipoInscripcion === 'obra';
        const obra = insc.obra || null;
        const obraSnapshot = {
          id: obra?._id || insc.datos?.obraId,
          title: obra?.title || insc.datos?.obraTitulo,
          image: obra?.imageUrl || insc.datos?.obraImagen,
          description: obra?.description || insc.datos?.obraDescripcion
        };

        // Datos adicionales
        let datosHtml = '';
        if (insc.datos && Object.keys(insc.datos).length) {
          const visibleEntries = Object.entries(insc.datos).filter(([k]) => !['tipoInscripcion', 'obraId', 'obraTitulo', 'obraImagen', 'obraDescripcion', 'obraYoutube', 'respuesta'].includes(k));
          if (visibleEntries.length) {
            datosHtml = `
              <div class="mt-4 ${esObra ? 'bg-cyan-500/5 border-cyan-500/10' : 'bg-black/40 border-white/5'} p-4 rounded-xl border">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-2">${esObra ? 'Datos adicionales provistos' : 'Respuestas del Formulario'}</span>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            `;
            for (const [key, val] of visibleEntries) {
              let valDisplay = escapeHTML(String(val || '-'));
              if (String(val).startsWith('http://') || String(val).startsWith('https://')) {
                valDisplay = `<a href="${escapeHTML(String(val))}" target="_blank" class="text-cyan-400 hover:underline break-all"><i class="fas fa-external-link-alt mr-1"></i>${escapeHTML(String(val))}</a>`;
              }
              datosHtml += `
                <div>
                  <span class="text-xs font-bold text-gray-500 uppercase block mb-0.5">${escapeHTML(key)}</span>
                  <span class="text-sm text-gray-200">${valDisplay}</span>
                </div>`;
            }
            datosHtml += `</div></div>`;
          }
        }

        let obraShowcaseHtml = '';
        if (esObra) {
          obraShowcaseHtml = `
            <div class="mt-4 p-4 rounded-2xl bg-gradient-to-r from-cyan-500/15 via-cyan-500/5 to-transparent border-2 border-cyan-500/30 flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
              <div class="flex items-center gap-4">
                <div class="relative w-20 h-20 md:w-24 md:h-24 rounded-2xl overflow-hidden border border-cyan-500/30 shrink-0 bg-black/60 shadow-lg shadow-cyan-500/10">
                  ${obraSnapshot.image 
                    ? `<img src="${escapeHTML(obraSnapshot.image)}" alt="${escapeHTML(obraSnapshot.title || '')}" class="w-full h-full object-cover">` 
                    : `<div class="w-full h-full flex items-center justify-center text-cyan-400"><i class="fas fa-palette text-3xl"></i></div>`
                  }
                </div>
                <div>
                  <div class="flex items-center gap-2 mb-1">
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-cyan-400 text-black">Obra Postulada</span>
                    <span class="text-[11px] text-cyan-300 font-semibold">Postulación directa desde perfil</span>
                  </div>
                  <h4 class="text-base md:text-lg font-black text-white">${escapeHTML(obraSnapshot.title || 'Obra artística')}</h4>
                  ${obraSnapshot.description ? `<p class="text-xs text-gray-300 mt-1 line-clamp-2 max-w-xl">${escapeHTML(obraSnapshot.description)}</p>` : ''}
                </div>
              </div>
              ${obraSnapshot.id ? `
                <a href="post.html?id=${obraSnapshot.id}" target="_blank" class="shrink-0 px-4 py-2.5 rounded-xl bg-cyan-500 text-black font-black text-xs uppercase tracking-wider hover:bg-cyan-400 transition-all shadow-[0_0_20px_rgba(6,182,212,0.3)] inline-flex items-center gap-2">
                  <span>Ver Obra Completa</span>
                  <i class="fas fa-external-link-alt text-[10px]"></i>
                </a>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="bg-white/5 border ${esObra ? 'border-cyan-500/30' : 'border-white/10'} rounded-3xl p-5 md:p-6 transition-all hover:border-white/30">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl ${esObra ? 'bg-cyan-500/10 border-cyan-500/20 text-cyan-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'} border flex items-center justify-center text-lg font-bold shrink-0">
                  ${(user.username || '?')[0].toUpperCase()}
                </div>
                <div>
                  <a href="profile.html?user=${user.username}" target="_blank" class="text-base font-bold text-white hover:text-cyan-400 transition-colors">@${escapeHTML(user.username || 'usuario')}</a>
                  <p class="text-xs text-gray-400">${escapeHTML(user.email || 'Sin email')}</p>
                  <p class="text-[10px] text-gray-500 mt-0.5"><i class="far fa-clock mr-1"></i>${new Date(insc.createdAt).toLocaleString('es-AR')}</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                ${esObra 
                  ? `<span class="px-3 py-1 rounded-xl text-xs font-black bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 uppercase tracking-wider flex items-center gap-1.5"><i class="fas fa-palette text-cyan-400"></i> Obra de Perfil</span>`
                  : `<span class="px-3 py-1 rounded-xl text-xs font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 uppercase tracking-wider flex items-center gap-1.5"><i class="fas fa-file-signature text-emerald-400"></i> Formulario</span>`
                }
                <span class="px-3 py-1 rounded-xl text-xs font-bold bg-${estadoColor}-500/20 text-${estadoColor}-400 border border-${estadoColor}-500/30 uppercase tracking-wider">${insc.estado}</span>
              </div>
            </div>
            
            ${obraShowcaseHtml}

            ${insc.mensaje ? `
              <div class="mt-4 p-3.5 bg-black/40 rounded-xl border border-white/5">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">
                  <i class="fas fa-comment-dots mr-1"></i> Mensaje del postulante
                </span>
                <p class="text-sm text-gray-300 italic">"${escapeHTML(insc.mensaje)}"</p>
              </div>
            ` : ''}

            ${datosHtml}
            
            <div class="mt-4 pt-4 border-t border-white/10 flex gap-2 justify-end">
              <button onclick="actualizarEstado('${insc._id}', 'aceptada')" class="px-4 py-2 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 text-xs font-bold hover:bg-green-500/20 transition-all flex items-center gap-1.5">
                <i class="fas fa-check"></i> Aceptar
              </button>
              <button onclick="actualizarEstado('${insc._id}', 'rechazada')" class="px-4 py-2 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold hover:bg-red-500/20 transition-all flex items-center gap-1.5">
                <i class="fas fa-times"></i> Rechazar
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function actualizarEstado(inscripcionId, estado) {
      try {
        const res = await apiRequest(`/oportunidades/${oportunidadId}/inscripciones/${inscripcionId}`, {
          method: 'PATCH',
          body: JSON.stringify({ estado }),
        });

        if (res && res.ok) {
          await loadInscripciones();
        } else {
          alert('Error al actualizar el estado de la postulación.');
        }
      } catch (err) {
        console.error(err);
        alert('Error al actualizar el estado de la postulación.');
      }
    }

    function showUnauthorized(reason) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('postulantes-content').classList.add('hidden');
      if (reason) document.getElementById('unauthorized-reason').textContent = reason;
      document.getElementById('unauthorized-message').classList.remove('hidden');
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
