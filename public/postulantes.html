<!DOCTYPE html>
<html lang="es" data-theme="suave">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postulantes - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
  <link rel="stylesheet" href="css/paginas/postulantes.css">
</head>
<body class="ui-con-header min-h-screen">
  <div id="p5-global-canvas" class="dp-1"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-20 pb-10 max-w-5xl mx-auto px-4">
    <!-- Loading -->
    <div id="loading" class="text-center py-20">
      <i class="fas fa-spinner fa-spin text-4xl text-emerald-400 mb-4"></i>
      <p class="text-gray-400">Verificando permisos y cargando postulantes...</p>
    </div>

    <!-- Error / Acceso Denegado -->
    <div id="unauthorized-message" class="hidden text-center py-20 bg-white/5 border border-red-500/30 rounded-3xl p-8 max-w-xl mx-auto">
      <i class="fas fa-user-lock text-5xl text-red-400 mb-4"></i>
      <h2 class="text-2xl font-bold text-white mb-2">Acceso Restringido</h2>
      <p id="unauthorized-reason" class="text-gray-400 mb-6">Esta sección solo está disponible para el creador de la oportunidad.</p>
      <a href="oportunidades.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-bold text-sm uppercase tracking-widest hover:bg-emerald-500/20 transition-all">
        <i class="fas fa-arrow-left"></i> Volver a Oportunidades
      </a>
    </div>

    <!-- Contenido de Postulantes (Solo para Creador) -->
    <div id="postulantes-content" class="hidden space-y-8">
      <!-- Header Convocatoria -->
      <section class="bg-white/5 border border-white/10 rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-3">
          <a id="btn-back-opo" href="oportunidad.html" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:border-emerald-500/50 transition-all">
            <i class="fas fa-arrow-left"></i>
          </a>
          <span id="opo-tipo-badge" class="px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest"></span>
          <a id="btn-ver-planilla" href="#" class="ml-auto inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold uppercase tracking-widest hover:bg-cyan-500/20 transition-all">
            <i class="fas fa-table-list"></i> Ver Planilla
          </a>
        </div>
        <h1 id="opo-titulo" class="text-2xl md:text-3xl font-black text-white mb-2"></h1>
        <p class="text-sm text-gray-400 flex items-center gap-2">
          <i class="fas fa-users text-emerald-400"></i>
          <span>Gestión de postulaciones recibidas</span>
        </p>
      </section>

      <!-- Lista de Inscriptos -->
      <section>
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <i class="fas fa-clipboard-list text-emerald-400"></i> Postulaciones (<span id="total-count">0</span>)
          </h2>

          <!-- Filtros por Origen -->
          <div class="inline-flex p-1 rounded-2xl bg-white/5 border border-white/10 shrink-0">
            <button data-on-click="filtrarPostulaciones('all')" id="btn-filtro-all" class="px-4 py-2 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-lg flex items-center gap-1.5">
              <span>Todas</span> (<span id="count-all">0</span>)
            </button>
            <button data-on-click="filtrarPostulaciones('obra')" id="btn-filtro-obra" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center gap-1.5">
              <i class="fas fa-palette text-cyan-400"></i>
              <span>Obras</span> (<span id="count-obras">0</span>)
            </button>
            <button data-on-click="filtrarPostulaciones('formulario')" id="btn-filtro-formulario" class="px-4 py-2 rounded-xl text-xs font-bold transition-all text-gray-400 hover:text-white flex items-center gap-1.5">
              <i class="fas fa-file-signature text-emerald-400"></i>
              <span>Formulario</span> (<span id="count-formulario">0</span>)
            </button>
          </div>
        </div>

        <div id="inscripciones-container" class="space-y-4">
          <!-- Se llena dinámicamente -->
        </div>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/header.js?v=5"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/p5-effect.js?v=12"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>
  <script src="js/paginas/postulantes-1.js"></script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=10"></script>
<script src="js/lib/inline-handlers.js" defer></script>
</body>
</html>
