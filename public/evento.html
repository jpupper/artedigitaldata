<!DOCTYPE html>
<html lang="es" data-theme="suave">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evento - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
  <link rel="stylesheet" href="css/paginas/evento.css">
</head>
<body class="ui-con-header min-h-screen">
  <div id="p5-canvas" class="dp-1"></div>
  <div id="app-header"></div>

  <main class="relative z-10 pt-24 pb-12 max-w-4xl mx-auto px-4">
    <div id="event-content" class="hidden">
      <div class="rounded-3xl overflow-hidden border border-white/10 card-cyber bg-black/40">
        <div id="event-image-container" class="aspect-video w-full overflow-hidden bg-magenta-500/5 flex items-center justify-center">
          <!-- Image will be injected here -->
        </div>
        
        <div class="p-8 md:p-12">
          <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div id="event-date-badge" class="px-4 py-2 bg-magenta-500/20 text-magenta-400 rounded-xl font-black text-sm uppercase tracking-widest">
              <!-- Date will be injected here -->
            </div>
            <div class="flex items-center gap-3 text-gray-500 text-sm">
              <div id="creator-avatar" class="w-8 h-8 rounded-full overflow-hidden bg-white/5 border border-white/10 flex items-center justify-center text-xs font-bold text-cyan-400 shrink-0">
                <!-- Avatar injected here -->
              </div>
              <span>Organizado por <a id="event-creator" href="#" class="text-white font-bold hover:text-cyan-400 transition-colors"></a></span>
            </div>
            <button id="like-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-white/10 hover:bg-white/5 transition-all text-gray-400">
               <i class="far fa-heart text-lg"></i>
               <span id="like-count" class="font-bold">0</span>
            </button>
          </div>

          <h1 id="event-title" class="text-4xl md:text-5xl font-black text-white mb-6"></h1>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
            <!-- Hora -->
            <div class="flex items-start gap-4 p-4 rounded-2xl bg-white/5 border border-white/5">
              <i class="fas fa-clock text-magenta-500 mt-1"></i>
              <div>
                <h4 class="text-xs font-bold text-gray-500 uppercase">Hora</h4>
                <p id="event-time" class="text-white font-medium"></p>
              </div>
            </div>
            <!-- Compartir -->
            <button data-on-click="shareEvent()" class="group flex items-center justify-center gap-3 p-4 rounded-2xl bg-white/5 border border-white/10 text-white font-bold hover:bg-cyan-500 hover:text-black transition-all h-full">
              <i class="fas fa-share-alt group-hover:scale-110 transition-transform"></i>
              COMPARTIR EVENTO
            </button>
            <!-- Ubicación -->
            <div class="flex items-start gap-4 p-4 rounded-2xl bg-white/5 border border-white/5">
              <i class="fas fa-map-marker-alt text-cyan-500 mt-1"></i>
              <div>
                <h4 class="text-xs font-bold text-gray-500 uppercase">Ubicación</h4>
                <p id="event-location" class="text-white font-medium"></p>
              </div>
            </div>
            <!-- Comprar Entrada -->
            <div id="ticket-actions" class="hidden h-full">
              <!-- Ticket button will be injected here -->
            </div>
          </div>

          <div class="prose prose-invert max-w-none mb-12">
            <h3 class="text-xl font-bold text-white mb-4 border-l-4 border-magenta-500 pl-4">Descripción</h3>
            <p id="event-description" class="text-gray-300 leading-relaxed whitespace-pre-line"></p>
          </div>

          <div id="event-tags-container" class="hidden mb-10 flex flex-wrap gap-2">
            <!-- Tags will be injected here -->
          </div>

          <div id="participants-section" class="pt-8 border-t border-white/5 mb-10">
            <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
              <h4 class="text-sm font-bold text-gray-400 uppercase tracking-widest">Participantes Etiquetados</h4>
              <a id="gallery-link" href="#" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500/10 to-fuchsia-500/10 border border-cyan-500/30 text-cyan-400 font-bold text-xs uppercase tracking-widest hover:from-cyan-500/20 hover:to-fuchsia-500/20 transition-all">
                <i class="fas fa-th-large"></i> Ver Galería
              </a>
            </div>
            <div id="participants-list" class="flex flex-wrap gap-3">
              <!-- Participants will be injected here -->
            </div>
          </div>

          <!-- Comments Section -->
          <div class="border-t border-white/10 pt-8">
            <h3 class="text-xl font-bold text-white mb-6">
              <i class="fas fa-comments text-cyan-400 mr-2"></i>Comentarios (<span id="comment-count">0</span>)
            </h3>
            
            <div id="comment-form-container" class="mb-8">
              <!-- Form will be injected here -->
            </div>

            <div id="comments-list" class="space-y-6">
              <!-- Comments will be injected here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="py-20 text-center">
      <i class="fas fa-spinner fa-spin text-4xl text-magenta-500 mb-4"></i>
      <p class="text-gray-500">Sincronizando datos del evento...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="hidden py-20 text-center">
      <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-6"></i>
      <h2 class="text-2xl font-bold text-white mb-2">Evento no encontrado</h2>
      <p class="text-gray-500 mb-8">El evento que buscas no existe o fue eliminado.</p>
      <a href="calendario.html" class="btn-primary px-8 py-3 rounded-xl">Volver al Calendario</a>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/header.js?v=5"></script>
  <script src="js/tagging.js"></script>
  <script src="js/forms.js?v=2"></script>
  <script src="js/edit-logic.js?v=2"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/notifications.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="js/paginas/evento-1.js"></script>

  <!-- Global Edit Modal -->
  <div id="global-edit-modal" class="hidden fixed inset-0 z-[100] flex items-start justify-center bg-black/80 px-4 py-8 backdrop-blur-md overflow-y-auto">
    <div class="w-full max-w-3xl rounded-3xl border border-white/10 card-cyber bg-[#0d0d12] p-8 relative my-auto">
      <button data-on-click="closeGlobalEdit()" class="absolute top-4 right-4 text-gray-400 hover:text-white z-10 bg-black/50 w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-all">
        <i class="fas fa-times"></i>
      </button>
      <div id="edit-modal-content" class="max-h-[70vh] overflow-y-auto pr-2 scrollbar-hide"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/p5-effect.js?v=12"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=10"></script>
<script src="js/lib/inline-handlers.js" defer></script>
</body>
</html>
