<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efecto de Partículas - Arte Digital Data</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d12;
    }
    #p5-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(255, 255, 255, 0.4);
      font-family: monospace;
      font-size: 13px;
      letter-spacing: 1px;
      pointer-events: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="p5-canvas"></div>
  <div class="info">Mové el mouse o tocá la pantalla para interactuar</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
