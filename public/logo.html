<!DOCTYPE html>
<html lang="es" data-theme="suave">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Arte Digital Data - Logo Interactive</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <!-- Tipografías extra para Letrasp5: terminal, pixel-art retro y monospace de código -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=DotGothic16&family=Share+Tech+Mono&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;700&family=Fira+Code:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Inconsolata:wght@400;700&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;700&family=Jersey+10&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <link rel="stylesheet" href="css/paginas/logo.css">
  <!-- CAPA FONDO: cajas cuadradas + UI de vidrio fina sobre el fondo animado del
       JP Shader Editor (misma receta que index.html/galeria.html/404.html) -->
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
</head>

<body>
  <!-- Canvas para el Efecto de Fondo de Letras y Partículas p5 -->
  <div id="p5-canvas"></div>

  <!-- Viewport Stage del Logo -->
  <div class="viewport-stage" id="viewport-stage">
    <div class="logo-transform-box" id="logo-box">
      <canvas id="logo-aura-canvas" class="logo-aura-canvas"></canvas>
      <img src="img/artedigital.png" alt="Arte Digital Data" class="logo-pure-img" />
    </div>
  </div>

  <!-- Botón alternador del HUD -->
  <button class="toggle-hud-btn" id="toggle-hud-btn" title="Mostrar/Ocultar Controles (H)">
    <i class="fas fa-sliders-h" id="hud-icon"></i>
  </button>

  <!-- Panel de Control HUD -->
  <div class="hud-panel" id="hud-panel">
    <div class="hud-header">
      <div class="hud-title">
        <i class="fas fa-compass"></i>
        <span>Transformación Logo</span>
      </div>
      <button class="hud-btn logo-e1" data-on-click="toggleHUD()" title="Cerrar panel">
        <i class="fas fa-times text-xs"></i>
      </button>
    </div>

    <!-- Escala (Zoom) -->
    <div class="control-group">
      <div class="control-label-row">
        <span><i class="fas fa-expand-alt mr-1 text-cyan-400"></i>Escala (Zoom)</span>
        <span class="control-value" id="val-scale">1.00x</span>
      </div>
      <input type="range" class="custom-range" id="range-scale" min="0.1" max="4.0" step="0.01" value="1.0">
    </div>

    <!-- Posición X -->
    <div class="control-group">
      <div class="control-label-row">
        <span><i class="fas fa-arrows-alt-h mr-1 text-pink-400"></i>Posición X (Horizontal)</span>
        <span class="control-value" id="val-x">0 px</span>
      </div>
      <input type="range" class="custom-range" id="range-x" min="-1000" max="1000" step="1" value="0">
    </div>

    <!-- Posición Y -->
    <div class="control-group">
      <div class="control-label-row">
        <span><i class="fas fa-arrows-alt-v mr-1 text-purple-400"></i>Posición Y (Vertical)</span>
        <span class="control-value" id="val-y">0 px</span>
      </div>
      <input type="range" class="custom-range" id="range-y" min="-1000" max="1000" step="1" value="0">
    </div>

    <!-- Rotación -->
    <div class="control-group">
      <div class="control-label-row">
        <span><i class="fas fa-sync-alt mr-1 text-emerald-400"></i>Rotación</span>
        <span class="control-value" id="val-rot">0°</span>
      </div>
      <input type="range" class="custom-range" id="range-rot" min="0" max="360" step="1" value="0">
    </div>

    <!-- Botones de Acción (Guardar, Restablecer, Centrar) -->
    <div class="action-btn-grid">
      <button class="hud-btn hud-btn-save" data-on-click="saveTransform()" title="Guardar configuración actual de transformación">
        <i class="fas fa-save"></i> Guardar
      </button>
      <button class="hud-btn hud-btn-primary" data-on-click="resetTransform()" title="Restablecer a valores por defecto">
        <i class="fas fa-undo"></i> Reset
      </button>
      <button class="hud-btn hud-btn-primary" data-on-click="centerLogo()" title="Centrar posición X e Y">
        <i class="fas fa-crosshairs"></i> Centrar
      </button>
    </div>
  </div>

  <!-- Toast Notificación -->
  <div class="toast-msg" id="toast-msg">
    <i class="fas fa-check-circle"></i>
    <span id="toast-text">Transformación guardada</span>
  </div>

  <!-- Scripts Base y p5 -->
  <script src="js/config.js?v=6"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>window.FSC_NO_ASCII_BG = true; /* que p5-effect.js no vuelva a inyectar el fondo viejo */</script>
  <script src="js/p5-effect.js?v=12"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>

  <!-- Shader del Aura WebGL -->
  <script src="js/paginas/logo-1.js"></script>

  <!-- Lógica de Control de Traslación, Escala e Interacción -->
  <script src="js/paginas/logo-2.js"></script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/jpconnect/js/fsc-button.js?v=10"></script>
<script src="js/lib/inline-handlers.js" defer></script>
</body>

</html>
