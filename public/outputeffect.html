<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Output Effect - Arte Digital Data</title>
  <link rel="stylesheet" href="css/particulas.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    #p5-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
    }
    .output-info-overlay {
      position: fixed;
      bottom: 12px;
      left: 12px;
      z-index: 100;
      font-family: sans-serif;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body class="ui-hidden">
  <div id="p5-canvas"></div>

  <div class="output-info-overlay">
    <span id="output-title">Cargando secuencia...</span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
  <script src="js/particulas.js"></script>
</body>
</html>
