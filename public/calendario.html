<!DOCTYPE html>
<html lang="es" data-theme="suave">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendario.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/fsc-ui.css?v=6">
  <link rel="stylesheet" href="css/fondo-ui.css?v=14">
  <link rel="stylesheet" href="css/paginas/calendario.css">
</head>
<body class="ui-con-header min-h-screen">
  <div id="p5-canvas" class="dp-1"></div>
  <div id="app-header" class="dp-2"></div>

  <main class="relative z-10 pt-24 pb-12 max-w-7xl mx-auto px-4">
    <div class="fk-head flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-black text-white flex items-center gap-3">
          <i class="fas fa-calendar-alt text-cyan-400"></i> Calendario Comunidad
        </h1>
      </div>
      <div class="flex items-center gap-4 bg-black/40 p-2 rounded-2xl border border-white/10">
        <button data-on-click="prevMonth()" class="w-10 h-10 rounded-xl hover:bg-white/10 text-white transition-all"><i class="fas fa-chevron-left"></i></button>
        <span id="current-month-year" class="text-lg font-bold text-[var(--color-cyan)] min-w-[150px] text-center">Marzo 2026</span>
        <button data-on-click="nextMonth()" class="w-10 h-10 rounded-xl hover:bg-white/10 text-white transition-all"><i class="fas fa-chevron-right"></i></button>
      </div>
      <a href="create.html" class="btn-primary px-6 py-2 rounded-xl text-sm"><i class="fas fa-plus mr-2"></i>Nuevo Evento</a>
    </div>

    <!-- Calendar Grid -->
    <div class="rounded-3xl overflow-hidden shadow-2xl shadow-cyan-500/5">
      <div class="grid grid-cols-7 bg-black/40 border-x border-t border-white/10">
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Dom</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Lun</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Mar</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Mié</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Jue</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Vie</div>
        <div class="text-center py-4 text-xs font-bold uppercase tracking-widest text-gray-500">Sáb</div>
      </div>
      <div id="calendar-body" class="calendar-grid border border-white/10">
        <!-- JS will populate this -->
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js?v=7"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/header.js?v=5"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/paginas/calendario-1.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/p5-effect.js?v=12"></script>
  <script src="https://vps-4455523-x.dattaweb.com/jpshadereditor/include.js"
          data-page="artedigitaldata" data-comp="artedigital-ascii" data-pass="ascii1"
          data-keep-bg="1"></script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=10"></script>
<script src="js/lib/inline-handlers.js" defer></script>
</body>
</html>
