<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar - Arte Digital Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    /* Estilos propios del panel de filtros (no dependen del build de Tailwind) */
    .search-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      transition: all 0.2s ease;
    }
    .search-filter-chip:hover {
      border-color: rgba(0, 242, 254, 0.4);
      color: #fff;
    }
    .search-filter-chip.is-active {
      background: rgba(0, 242, 254, 0.15);
      border-color: rgba(0, 242, 254, 0.5);
      color: #00f2fe;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.15);
    }
    .search-filter-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #64748b;
      font-weight: 800;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-filter-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .search-filter-input:focus {
      border-color: rgba(0, 242, 254, 0.5);
    }
    .search-filters-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #00f2fe;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
    }
    .search-filters-clear {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .search-filters-clear:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="p5-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
  <div id="app-header" style="position: relative; z-index: 100;"></div>

  <main class="relative z-10 pt-24 pb-10 max-w-5xl mx-auto px-4">
    <div class="mb-8 text-center">
      <h1 class="text-4xl font-black gradient-text mb-4">Buscador Global</h1>
      <div class="relative max-w-2xl mx-auto">
        <input type="text" id="search-input" placeholder="Busca obras, recursos, chances, artistas, tags..."
          class="w-full bg-white/5 border border-cyan-500/30 rounded-2xl px-6 py-4 text-xl text-white placeholder-gray-500 focus:border-cyan-400 focus:outline-none focus:ring-1 focus:ring-cyan-400 transition-all shadow-lg shadow-cyan-500/10">
        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-cyan-400">
          <i class="fas fa-search text-xl"></i>
        </div>
      </div>
    </div>

    <!-- Panel de Filtros -->
    <div class="mb-10 rounded-2xl bg-white/5 border border-white/10 p-4 md:p-5">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <button id="filters-toggle" class="search-filters-toggle" title="Mostrar u ocultar los filtros">
          <i class="fas fa-chevron-up"></i> Filtros
        </button>
        <button id="filters-clear" class="search-filters-clear" title="Quitar todos los filtros">
          <i class="fas fa-eraser mr-1"></i> Limpiar filtros
        </button>
      </div>

      <div id="filters-panel" class="mt-4 space-y-4">
        <div>
          <div class="search-filter-label"><i class="fas fa-filter"></i> Tipo de contenido</div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="search-filter-chip" data-type="post" title="Obras publicadas por la comunidad">
              <i class="fas fa-palette"></i> Obras
            </button>
            <button type="button" class="search-filter-chip" data-type="resource" title="Recursos, links y material de estudio">
              <i class="fas fa-box-open"></i> Recursos
            </button>
            <button type="button" class="search-filter-chip" data-type="oportunidad" title="Convocatorias, trabajos y colaboraciones">
              <i class="fas fa-briefcase"></i> Chances
            </button>
            <button type="button" class="search-filter-chip" data-type="user" title="Perfiles de artistas y usuarios">
              <i class="fas fa-users"></i> Artistas
            </button>
            <button type="button" class="search-filter-chip" data-type="event" title="Eventos y muestras">
              <i class="fas fa-calendar-day"></i> Eventos
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <div class="search-filter-label"><i class="fas fa-briefcase"></i> Tipo de chance</div>
            <select id="filter-subtype" class="search-filter-input">
              <option value="">Todos los tipos</option>
              <option value="convocatoria_obra">Convocatoria de obra</option>
              <option value="oportunidad_laboral">Oportunidad laboral</option>
              <option value="colaboracion">Colaboración</option>
            </select>
          </div>
          <div>
            <div class="search-filter-label"><i class="fas fa-tags"></i> Palabras clave (tags)</div>
            <input type="text" id="filter-tags" class="search-filter-input" placeholder="ej: glsl, 3d, video, ia..." spellcheck="false">
          </div>
        </div>
      </div>
    </div>

    <div id="results-sections" class="space-y-12">
      <!-- Results will be injected here -->
      <div id="initial-state" class="text-center py-20 text-gray-500">
        <i class="fas fa-rocket text-5xl mb-4 opacity-20"></i>
        <p class="text-xl">Escribí algo o elegí un filtro para empezar a explorar...</p>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/generative-avatar.js"></script>
  <script src="js/search.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="js/ascii-shader-bg.js"></script>
  <script src="js/p5-effect.js"></script>
</body>
</html>
